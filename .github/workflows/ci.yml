name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests, type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # Secrets are not available to PRs from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Write .env
        run: echo "MAPBOX_API_KEY=${{ secrets.MAPBOX_API_KEY_TEST }}" > .env
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results

  preview-on-e2e-failure:
    name: Deploy preview for failed E2E
    needs: e2e
    if: always() && github.event_name == 'pull_request' && needs.e2e.result == 'failure'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/preview.yml
    with:
      force: true
    secrets: inherit

  deploy:
    name: Deploy to FTP
    needs: [unit, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production-deploy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          echo "MAPBOX_API_KEY=${{ secrets.MAPBOX_API_KEY_PROD }}" > .env
          npm run build
      - uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_PATH }}
          local-dir: ./dist/
          # Replaces everything that already exists in the target directory
          dangerous-clean-slate: true
